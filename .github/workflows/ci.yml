name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # The CI-watch PR (main -> ci-watch) only relays main's push runs to the QA session.
    branches-ignore: [ci-watch]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# PRs run lint, JVM tests and a web build + Playwright smoke test. Android/iOS builds
# and the Pages deploy run after merge (push to main) or on a manual run. Pushes to
# feature branches trigger nothing: sessions run `ktlintCheck :composeApp:jvmTest`
# (and the web check) locally, the PR re-checks it. Draft PRs run nothing: the task
# author opens the PR as a draft before work starts, and CI runs once the developer
# marks it Ready for review (and on every push after that).
jobs:
  checks:
    name: Lint & unit tests
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: ktlint
        run: ./gradlew ktlintCheck
      - name: UI tests (JVM)
        run: ./gradlew :composeApp:jvmTest
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/'

  web-smoke:
    name: Web smoke
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_VERSION: 1.56.1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Build web distribution
        run: ./gradlew :composeApp:wasmJsBrowserDistribution
      - name: Serve web build
        run: |
          python3 -m http.server 8000 --directory composeApp/build/dist/wasmJs/productionExecutable &
          echo $! > "$RUNNER_TEMP/server.pid"
          for i in $(seq 1 30); do curl -sf http://localhost:8000/ >/dev/null && exit 0; sleep 1; done
          echo "Web server did not come up" >&2
          exit 1
      - name: Install Playwright (pinned, outside the repo)
        run: |
          mkdir -p "$RUNNER_TEMP/pw-smoke"
          npm i --no-save --prefix "$RUNNER_TEMP/pw-smoke" "playwright@$PLAYWRIGHT_VERSION"
          "$RUNNER_TEMP/pw-smoke/node_modules/.bin/playwright" install --with-deps chromium
      - name: Run web smoke test
        env:
          NODE_PATH: ${{ runner.temp }}/pw-smoke/node_modules
          SMOKE_BASE_URL: http://localhost:8000
          SMOKE_OUT_DIR: web-smoke-screenshots
        run: node .github/scripts/web-smoke.mjs
      - name: Stop web server
        if: always()
        run: kill "$(cat "$RUNNER_TEMP/server.pid")" 2>/dev/null || true
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-smoke-screenshots
          path: web-smoke-screenshots/

  android:
    name: Android
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Build debug APK
        run: ./gradlew :androidApp:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: your-anima-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk

  web:
    name: Web (Wasm)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Build web distribution
        run: ./gradlew :composeApp:wasmJsBrowserDistribution
      - name: Upload web bundle
        uses: actions/upload-artifact@v7
        with:
          name: web
          path: composeApp/build/dist/wasmJs/productionExecutable/

  ios:
    name: iOS
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Common tests on iOS simulator
        run: ./gradlew :composeApp:iosSimulatorArm64Test
      - name: Build iOS app (simulator, unsigned)
        run: cd iosApp && xcodebuild -scheme iosApp -configuration Debug -sdk iphonesimulator -arch arm64 CODE_SIGNING_ALLOWED='NO'

  # Publishes the web build to the gh-pages branch so it can be opened on a phone:
  #   main                                 -> https://<owner>.github.io/<repo>/
  #   manual run (Run workflow) on a branch -> https://<owner>.github.io/<repo>/preview/<branch-with-dashes>/
  web-preview:
    name: Publish web preview
    needs: web
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: web
          path: site
      - name: Resolve target directory
        id: target
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$BRANCH" = "main" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
            echo "path=" >> "$GITHUB_OUTPUT"
          else
            slug=$(echo "$BRANCH" | tr '/' '-' | tr -cd 'A-Za-z0-9._-')
            echo "dir=preview/$slug" >> "$GITHUB_OUTPUT"
            echo "path=preview/$slug/" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          destination_dir: ${{ steps.target.outputs.dir }}
          keep_files: true
      - name: Summary
        run: |
          echo "Web preview: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ steps.target.outputs.path }}" >> "$GITHUB_STEP_SUMMARY"

  # Keeps the latest debug APK from main at one stable, phone-friendly URL:
  #   https://github.com/<owner>/<repo>/releases/download/main-latest/your-anima-debug.apk
  apk-release:
    name: Publish APK (main-latest)
    needs: android
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: apk-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: your-anima-debug-apk
          path: apk
      - name: Replace main-latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp apk/*.apk your-anima-debug.apk
          gh release delete main-latest --cleanup-tag --yes || true
          gh release create main-latest your-anima-debug.apk \
            --target "$GITHUB_SHA" --prerelease --title "Latest main build" \
            --notes "Debug APK from ${GITHUB_SHA::7} (CI run $GITHUB_RUN_ID)."
      - name: Summary
        run: |
          echo "APK: https://github.com/${{ github.repository }}/releases/download/main-latest/your-anima-debug.apk" >> "$GITHUB_STEP_SUMMARY"
