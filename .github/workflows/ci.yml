name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Push events run checks, Android and Web on every branch.
# iOS runs on macOS (10x billed minutes), so only for PRs, main and manual runs.
jobs:
  checks:
    name: Lint & unit tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: ktlint
        run: ./gradlew ktlintCheck --stacktrace
      - name: Shared UI tests (JVM)
        run: ./gradlew :shared:jvmTest --stacktrace
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/'

  android:
    name: Android
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Build debug APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: your-anima-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk

  web:
    name: Web (Wasm)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Build web distribution
        run: ./gradlew :webApp:wasmJsBrowserDistribution --stacktrace
      - name: Upload web bundle
        uses: actions/upload-artifact@v7
        with:
          name: web
          path: webApp/build/dist/wasmJs/productionExecutable/

  ios:
    name: iOS
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Shared tests on iOS simulator
        run: ./gradlew :shared:iosSimulatorArm64Test --stacktrace
      - name: Build iOS app (simulator, unsigned)
        run: cd iosApp && xcodebuild -scheme iosApp -configuration Debug -sdk iphonesimulator -arch arm64 CODE_SIGNING_ALLOWED='NO'

  # Publishes the web build to the gh-pages branch so it can be opened on a phone:
  #   main             -> https://<owner>.github.io/<repo>/
  #   any other branch -> https://<owner>.github.io/<repo>/preview/<branch-with-dashes>/
  web-preview:
    name: Publish web preview
    needs: web
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: web
          path: site
      - name: Resolve target directory
        id: target
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$BRANCH" = "main" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
            echo "path=" >> "$GITHUB_OUTPUT"
          else
            slug=$(echo "$BRANCH" | tr '/' '-' | tr -cd 'A-Za-z0-9._-')
            echo "dir=preview/$slug" >> "$GITHUB_OUTPUT"
            echo "path=preview/$slug/" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          destination_dir: ${{ steps.target.outputs.dir }}
          keep_files: true
      - name: Summary
        run: |
          echo "Web preview: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ steps.target.outputs.path }}" >> "$GITHUB_STEP_SUMMARY"
