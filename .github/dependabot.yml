    schedule:
      interval: weekly
    groups:
      kotlin-and-compose:
        patterns: ["org.jetbrains.kotlin*", "org.jetbrains.compose*", "org.jetbrains.androidx*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
